name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and format run once — they don't vary by platform or Node version.
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Biome lint
        run: npm run lint
      - name: Biome format
        run: npm run format:check
      - name: Types
        run: npm run typecheck

  test:
    name: Test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.17', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # A clean machine has no ~/.claude at all: the CLI must say so, not crash.
      - name: Runs with no Claude data
        run: |
          node bin/agentclock.js now
          node bin/agentclock.js stats
          node bin/agentclock.js pdf --no-open -o "$RUNNER_TEMP/one-pager.pdf"
